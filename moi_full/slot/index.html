<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teen Patti Slot</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="slot.css">
</head>
<body>
<div id="cv">
  <img id="bg" src="img/bg.webp" alt="">
  <div id="lights"></div>
  <div id="plate">TEEN PATTI</div>
  <div id="reels"></div>
  <div id="sweep"></div>
  <div id="arL" class="ar"></div><div id="arR" class="ar r"></div>

  <div id="top">
    <div id="bal"><b>Balance</b><span>💎 <i id="balN">0</i></span></div>
    <div id="trophy"><img src="../game2/img/trophy_full.webp" alt=""><i id="tt">00:00</i></div>
    <div id="wifi"><svg viewBox="0 0 30 24" width="34" height="27"><path d="M2 8 Q15-5 28 8 M7 13 Q15 5 23 13 M12 18 Q15 15 18 18" fill="none" stroke="#e8d020" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="21" r="2.2" fill="#e8d020"/></svg><span id="ping">120ms</span></div>
    <div id="bList" class="sq"><svg viewBox="0 0 40 40" width="40" height="40"><path d="M8 11h24M8 20h24M8 29h24" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></div>
    <div id="bX" class="sq"><svg viewBox="0 0 40 40" width="38" height="38"><path d="M9 9l22 22M31 9L9 31" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg></div>
  </div>

  <div id="winp"><em>WIN</em><b>💎 <i id="winN">0</i></b></div>
  <div id="bBolt"><img src="img/b_bolt.webp" alt=""></div>
  <div id="bMinus"><img src="img/b_minus.webp" alt=""></div>
  <div id="costp"><em>TOTAL COST</em><b>💎 <i id="costN">100</i></b></div>
  <div id="bPlus"><img src="img/b_plus.webp" alt=""></div>
  <div id="bSpin"><img src="img/b_spin.webp" alt=""></div>

  <div id="toast"></div>
  <div id="pop"><div id="pbox"><div class="pt">🎉 YOU WIN 🎉</div><div id="pcards"></div><div class="pv">💎 <i id="pv">0</i></div></div></div>
  <div id="modal"><div id="mbox"></div></div>
  <div id="loading"><div class="sp"></div></div>
</div>

<script src="../shared/core/firebase-init.js"></script>
<script src="../demo/seed.js"></script>
<script src="../shared/core/sync.js"></script>
<script src="../shared/core/sync-routes.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/core/economy.js"></script>
<script src="../shared/core/db-storage.js"></script>
<script src="../shared/core/auth.js"></script>
<script src="../shared/broadcast/broadcast-core.js"></script>
<script src="slot.js"></script>
</body>
</html>
