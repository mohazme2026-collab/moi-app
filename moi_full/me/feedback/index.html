<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MOI — Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="feedback.css">
</head>
<body>
<div class="fb-bg"></div>

<main class="fb-page">

  <header class="fb-top">
    <button class="fb-back" id="fbBack" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="fb-title">Feedback</span>
    <span class="fb-top-sp"></span>
  </header>

  <div class="fb-scroll" id="fbScroll">

    <p class="fb-lead">Tell us what you think. Every message is read.</p>

    <!-- ১) ধরন -->
    <h3 class="fb-h">What is it about?</h3>
    <div class="fb-types" id="fbTypes">
      <button type="button" class="fb-chip on" data-t="suggestion"><i>💡</i>Suggestion</button>
      <button type="button" class="fb-chip" data-t="bug"><i>🐞</i>Bug</button>
      <button type="button" class="fb-chip" data-t="payment"><i>💳</i>Payment</button>
      <button type="button" class="fb-chip" data-t="account"><i>👤</i>Account</button>
      <button type="button" class="fb-chip" data-t="report"><i>🚩</i>Report</button>
      <button type="button" class="fb-chip" data-t="other"><i>💬</i>Other</button>
    </div>

    <!-- ২) অভিজ্ঞতা -->
    <h3 class="fb-h">How is your experience?</h3>
    <div class="fb-faces" id="fbFaces">
      <button type="button" class="fb-face" data-r="1" aria-label="Very bad">😞</button>
      <button type="button" class="fb-face" data-r="2" aria-label="Bad">🙁</button>
      <button type="button" class="fb-face" data-r="3" aria-label="Okay">😐</button>
      <button type="button" class="fb-face" data-r="4" aria-label="Good">🙂</button>
      <button type="button" class="fb-face" data-r="5" aria-label="Great">😍</button>
    </div>

    <!-- ৩) লেখা -->
    <h3 class="fb-h">Your message</h3>
    <div class="fb-box">
      <textarea id="fbMsg" maxlength="500" placeholder="Write here…"></textarea>
      <span class="fb-count"><b id="fbCnt">0</b>/500</span>
    </div>

    <!-- ৪) যোগাযোগ -->
    <h3 class="fb-h">Contact <small>(optional)</small></h3>
    <input class="fb-input" id="fbContact" type="text" maxlength="60" placeholder="WhatsApp number or email" autocomplete="off">

    <button class="fb-submit" id="fbSubmit" type="button" disabled>Submit</button>

    <!-- সাপোর্ট ইমেইল -->
    <div class="fb-mail">
      <div><small>Need help faster?</small><b>support@moi.app</b></div>
      <button type="button" id="fbCopy">Copy</button>
    </div>

    <!-- আমার পাঠানো ফিডব্যাক -->
    <h3 class="fb-h" id="fbHistH" style="display:none">My feedback</h3>
    <div class="fb-hist" id="fbHist"></div>

  </div>
</main>

<div class="fb-toast" id="fbToast"></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core/firebase-init.js"></script>
<script src="../../shared/core/sync.js"></script>
<script src="../../shared/core/sync-routes.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/core/economy.js"></script>
<script src="../../shared/core/db-storage.js"></script>
<script src="../../shared/core/auth.js"></script>
<script src="feedback.js"></script>
</body>
</html>
