<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>MOI</title>
<link rel="stylesheet" href="splash.css">
</head>
<body>

<!-- ১) স্প্ল্যাশ: ৩ সেকেন্ড, আলোর ঝলকানিসহ -->
<div class="view show" id="v1">
  <img class="pic" src="splash.webp" alt="MOI">
  <div class="shine"></div>
  <div class="flash"></div>
  <div class="stars" id="stars"></div>
</div>

<!-- ২) বিজ্ঞাপন: শুধু যাদের লগইন আছে — ৩ সেকেন্ড, তীর চাপলে আগেই হোম -->
<div class="view" id="v2">
  <img class="bg" src="ad-bg.webp" alt="">
  <img class="adpic" src="ad.webp" alt="">
  <button class="skip" id="skip" aria-label="এড়িয়ে যান">
    <span class="ring"><svg viewBox="0 0 36 36" width="30" height="30"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3"/><circle id="prog" cx="18" cy="18" r="15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><b id="cnt">৩</b></span>
    <span class="lbl">এড়ান</span>
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script src="../shared/core/firebase-init.js"></script>
<script src="splash.js"></script>
</body>
</html>
