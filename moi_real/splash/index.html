<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>MOI</title>
<link rel="stylesheet" href="splash.css">
</head>
<body>

<!-- ১) স্প্ল্যাশ: ৩ সেকেন্ড, আলোর ঝলকানিসহ -->
<div class="view show" id="v1">
  <img class="pic" src="splash.webp" alt="MOI">
  <div class="shine"></div>
  <div class="flash"></div>
  <div class="stars" id="stars"></div>
</div>

<!-- ২) বিজ্ঞাপন: শুধু যাদের লগইন আছে -->
<div class="view" id="v2">
  <img class="pic" src="ad.webp" alt="">
  <div class="shine slow"></div>
  <button class="skip" id="skip" aria-label="এড়িয়ে যান"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="offer">
    <div class="o-t" id="oTitle"></div>
    <div class="o-s" id="oSub"></div>
    <button class="o-btn" id="oBtn"></button>
  </div>
</div>

<script src="../shared/core/firebase-init.js"></script>
<script src="splash.js"></script>
</body>
</html>
