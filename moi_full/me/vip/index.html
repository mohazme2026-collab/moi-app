<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MOI — VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vip.css">
</head>
<body>
<div class="vip-bg"></div>

<main class="vip-page">

  <!-- উপরের বার: Back + VIP -->
  <header class="vip-top">
    <button class="vip-back" id="vipBack" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="vip-title">VIP</span>
    <span class="vip-top-space"></span>
  </header>

  <!-- VIP১ – VIP৭ ট্যাব -->
  <nav class="vip-tabs" id="vipTabs">
    <button class="vip-tab on" type="button" data-lv="1">VIP1</button>
    <button class="vip-tab" type="button" data-lv="2">VIP2</button>
    <button class="vip-tab" type="button" data-lv="3">VIP3</button>
    <button class="vip-tab" type="button" data-lv="4">VIP4</button>
    <button class="vip-tab" type="button" data-lv="5">VIP5</button>
    <button class="vip-tab" type="button" data-lv="6">VIP6</button>
    <button class="vip-tab" type="button" data-lv="7">VIP7</button>
  </nav>

  <!-- মাঝের কার্ড (ডানে-বাঁয়ে সরানো যায়): বাঁয়ে ছবি ও নাম, ডানে ব্যাজের ফাঁকা জায়গা -->
  <section class="vip-cards" id="vipCards">
    <div class="vip-card" data-lv="1"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-1"></div></div>
    <div class="vip-card" data-lv="2"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-2"></div></div>
    <div class="vip-card" data-lv="3"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-3"></div></div>
    <div class="vip-card" data-lv="4"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-4"></div></div>
    <div class="vip-card" data-lv="5"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-5"></div></div>
    <div class="vip-card" data-lv="6"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-6"></div></div>
    <div class="vip-card" data-lv="7"><img class="vc-av" alt=""><span class="vc-name"></span><div class="vc-badge" id="badge-7"></div></div>
  </section>

  <!-- বড় বক্স: VIP Privileges (ভিতরের সুবিধাগুলো এখন ফাঁকা — পরে #items-১ … #items-৭ ঘরে বসবে) -->
  <section class="vip-panel">
    <div class="vip-ribbon"><span>VIP Privileges</span></div>
    <div class="vip-count" id="vipCount"></div>
    <div class="vip-items on" id="items-1"></div>
    <div class="vip-items" id="items-2"></div>
    <div class="vip-items" id="items-3"></div>
    <div class="vip-items" id="items-4"></div>
    <div class="vip-items" id="items-5"></div>
    <div class="vip-items" id="items-6"></div>
    <div class="vip-items" id="items-7"></div>
  </section>

  <!-- নিচের বার: দাম + কেনার বাটন -->
  <footer class="vip-bar">
    <span class="vip-hot">HOT <b>Sale</b></span>
    <div class="vip-prices">
      <div><span id="vipCost">240000</span> <i class="coin"></i> Renewal cost</div>
      <div><span id="vipReturn">240000</span> <i class="coin"></i> Return</div>
    </div>
    <button class="vip-renew" id="vipRenew" type="button">RENEW</button>
  </footer>

</main>

<div class="vip-toast" id="vipToast"></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core/firebase-init.js"></script>
<script src="../../shared/core/sync.js"></script>
<script src="../../shared/core/sync-routes.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/core/economy.js"></script>
<script src="../../shared/core/db-storage.js"></script>
<script src="../../shared/core/auth.js"></script>
<script src="vip.js"></script>
</body>
</html>
