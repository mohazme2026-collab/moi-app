<!DOCTYPE html>
<html lang="bn">
<head>
<script src="../shared/theme/theme.js"></script>
<script src="../shared/ui/fallback.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MOI — Me</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Playfair+Display:wght@700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="me.css">
<link rel="stylesheet" href="follow/follow.css">
<link rel="stylesheet" href="settings/settings.css">
<link rel="stylesheet" href="svip/svip-page.css">
<link rel="stylesheet" href="wallet/wallet.css">
<link rel="stylesheet" href="../shared/theme/theme.css">
<link rel="stylesheet" href="../shared/theme/nav.css">
<link rel="stylesheet" href="../shared/features/features.css">
<link rel="stylesheet" href="../shared/theme/theme-light.css">
<link rel="stylesheet" href="../shared/chat-badge/chat-badge.css">
<link rel="stylesheet" href="../shared/broadcast/broadcast.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="meG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cf0b4"/><stop offset="1" stop-color="#34c9a3"/></linearGradient><linearGradient id="meB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb4ff"/><stop offset="1" stop-color="#1c63d6"/></linearGradient></defs></svg>
<div class="me-bg"></div>

<main class="me-page" id="mePage">

  <header class="me-top">
    <span class="me-title">Me</span>
    <button class="me-gear" id="btnGear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
  </header>

  <section class="me-head">
    <div class="me-av"><img id="meAvatar" alt=""><i class="me-dot" id="meDot" hidden></i></div>
    <div class="me-info">
      <div class="me-name" id="meName">&nbsp;</div>
      <div class="me-idrow">
        <span class="me-id"><svg class="idb" viewBox="0 0 32 28"><defs><linearGradient id="idg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2a6fe0"/></linearGradient></defs><path d="M16 1.5l6 3 7 .5 1.5 6-3 5.5-3 7-4.5 3.5-4.5-3.5-3-7-3-5.5L2 5l7-.5z" fill="url(#idg)" stroke="#d9f1ff" stroke-width="1.2" stroke-linejoin="round"/><text x="16" y="17" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#fff">ID</text></svg><b id="meId">——</b></span>
        <button class="me-copy" id="btnCopy" aria-label="Copy ID"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button>
      </div>
      <div class="me-stats">
        <button class="me-stat" data-k="following"><b id="numFollowing">0</b><span>Following</span></button>
        <i class="sep"></i>
        <button class="me-stat" data-k="followers"><b id="numFollowers">0</b><span>Followers</span></button>
      </div>
    </div>
  </section>

  <section class="svip" data-k="svip" role="button" aria-label="SVIP">
    <img class="art" src="svip/btn_svip.webp" alt="SVIP1" draggable="false">
    <i class="glint"></i><i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i>
  </section>

  <section class="quick">
    <button class="qk" data-k="wallet" aria-label="Wallet"><img src="wallet/btn_wallet.webp" alt="Wallet" draggable="false"></button><button class="qk" data-k="store" aria-label="Store"><img src="store/btn_store.webp" alt="Store" draggable="false"></button><button class="qk" data-k="vip" aria-label="VIP"><img src="vip/btn_vip.webp" alt="VIP" draggable="false"></button>
  </section>

  <section class="list">
    <button class="row" data-k="level" aria-label="Level"><img src="level/btn_level.webp" alt="Level" draggable="false"></button>
    <button class="row" data-k="bag" aria-label="Bag"><img src="bag/btn_bag.webp" alt="Bag" draggable="false"></button>
    <button class="row" data-k="control" aria-label="User Control"><img src="control/btn_control.webp" alt="User Control" draggable="false"></button>
    <button class="row" data-k="visitor" aria-label="Visitor"><img src="visitor/btn_visitor.webp" alt="Visitor" draggable="false"></button>
    <button class="row" data-k="feedback" aria-label="Feedback"><img src="feedback/btn_feedback.webp" alt="Feedback" draggable="false"></button>
  </section>

</main>

  <nav class="nav"><div class="pill">
    <button class="nb" id="navRoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 00-3 3v5a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg><span>রুম</span></button>
    <button class="nb" id="navChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5a8 8 0 01-11.7 7.1L4 20l1.4-4.5A8 8 0 1120.5 11.5z"/></svg><span>মেসেজ</span></button>
    <button class="nb on" id="navMe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.7-4 3.8-5.8 7.5-5.8s6.8 1.8 7.5 5.8"/></svg><span>আমি</span></button>
  </div></nav>

<div class="me-toast" id="meToast"></div>

<script src="../shared/config.js"></script>
<script src="../shared/core/firebase-init.js"></script>
<script src="../demo/seed.js"></script>
<script src="../shared/core/sync.js"></script>
<script src="../shared/core/sync-routes.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/core/economy.js"></script>
<script src="../shared/core/db-storage.js"></script>
<script src="../shared/core/auth.js"></script>
<script src="../shared/chat-badge/chat-badge.js"></script>
<script src="../shared/broadcast/broadcast-core.js"></script>
<script src="../shared/broadcast/broadcast-ui.js"></script>
<script src="../shared/features/features.js"></script>
<script src="follow/follow.js"></script>
<script src="settings/i18n.js"></script>
<script src="settings/settings.js"></script>
<script src="../shared/store/store-data.js"></script>
<script src="../shared/svip/crown.js"></script>
<script src="../shared/svip/perks.js"></script>
<script src="../shared/svip/chat.js"></script>
<script src="../shared/svip/card.js"></script>
<script src="svip/svip-page.js"></script>
<script src="wallet/wallet.js"></script>
<script src="me.js"></script>
<script src="../demo/chatbots.js"></script>
<script src="../demo/broadcast-sim.js"></script>
</body>
</html>
