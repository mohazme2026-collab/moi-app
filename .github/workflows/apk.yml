name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build number
        run: |
          echo "{\"v\":\"build-${GITHUB_RUN_NUMBER}\"}" > moi_real/build.json
          cat moi_real/build.json

      - name: Deploy Firebase rules
        continue-on-error: true
        working-directory: moi_real
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx --yes firebase-tools@13 deploy --only firestore:rules,database --project moi-app-810b0 --non-interactive
          rm -f /tmp/sa.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert moi_real/icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            rm -f $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: SDK 35
        run: |
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          grep -n "compileSdk\|minSdk" android/variables.gradle

      - name: Version code
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Signing key (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/moi-release.keystore
          keytool -list -v -keystore android/moi-release.keystore -storepass "$KS_PASS" -alias moi > ks.txt
          SHA1=$(grep "SHA1:" ks.txt | head -1 | sed 's/.*SHA1: *//')
          echo "Keystore SHA1 = $SHA1"
          if [ "$SHA1" != "CE:73:40:69:06:F8:DB:84:98:2B:9B:70:C0:E4:39:16:7C:CD:5C:96" ]; then
            echo "::error::সই-চাবির SHA1 Firebase-এ দেওয়া SHA1-এর সাথে মিলছে না"; exit 1
          fi
          cp google-services.json android/app/google-services.json
          cat >> android/app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  release {
                      storeFile file("$rootDir/moi-release.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias 'moi'
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOG

      - name: Build APK (release)
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Live update files
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk META-INF/*.RSA | keytool -printcert | grep SHA1 || true
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/MOI.apk
          (cd moi_real && zip -qr ../out/bundle.zip .)
          cp moi_real/build.json out/version.json
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete live --cleanup-tag -y || true
          gh release create live out/MOI.apk out/bundle.zip out/version.json \
            --title "MOI live" --notes "build ${GITHUB_RUN_NUMBER}" --latest=false
