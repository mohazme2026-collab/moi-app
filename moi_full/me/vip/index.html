<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MOI — VIP</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="vip.css">
</head>
<body>
<div class="vip-bg"></div>

<main class="vip-page">

  <!-- উপরের বার: Back + VIP -->
  <header class="vip-top">
    <button class="vip-back" id="vipBack" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="vip-title">VIP</span>
    <span class="vip-top-space"></span>
  </header>

  <!-- ড্রাগন কার্ড: ইউজারের ছবি ও নাম -->
  <section class="vip-head">
    <div class="vh" id="vipHead">
      <img class="vh-av" id="vhAv" alt="">
      <img class="vh-bg" alt="" draggable="false" src="../../shared/svip/levels/vip1/entry_head.webp">
      <span class="vh-nm" id="vhNm"></span>
    </div>
    <div class="vip-left" id="vipLeft"></div>
  </section>

  <!-- সুবিধার বক্স -->
  <section class="vip-panel">
    <div class="vip-ribbon"><span>VIP Privileges</span></div>
    <div class="vip-grid" id="vipGrid"></div>
  </section>

  <!-- নিচের বার: ডায়মন্ডে দাম + কেনার বাটন -->
  <footer class="vip-bar">
    <div class="vip-price"><svg class="gem" viewBox="0 0 512 512" aria-hidden="true"><path fill="url(#vGemG)" d="M116.7 33.8c4.5-6.1 11.700-9.800 19.300-9.800h240c7.600 0 14.800 3.600 19.300 9.800l112 152c6.800 9.200 6.100 21.900-1.500 30.400l-232 256c-4.500 5-11 7.900-17.800 7.900s-13.200-2.900-17.800-7.900l-232-256c-7.700-8.500-8.300-21.200-1.500-30.400z"/><defs><linearGradient id="vGemG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9be8ff"/><stop offset=".7" stop-color="#36b4ff"/><stop offset="1" stop-color="#1a6fe0"/></linearGradient></defs></svg><span id="vipCost">240,000</span><small>/ 30 days</small></div>
    <button class="vip-buy" id="vipBuy" type="button">BUY</button>
  </footer>

</main>

<div class="vip-toast" id="vipToast"></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core/firebase-init.js"></script>
<script src="../../shared/core/sync.js"></script>
<script src="../../shared/core/sync-routes.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/core/economy.js"></script>
<script src="../../shared/core/db-storage.js"></script>
<script src="../../shared/core/auth.js"></script>
<script src="../../shared/svip/ringvid.js"></script>
<script src="../../shared/svip/crown.js"></script>
<script src="../../shared/svip/perks.js"></script>
<script src="../../shared/svip/chat.js"></script>
<script src="../../shared/svip/card.js"></script>
<script src="vip.js"></script>
</body>
</html>
