name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build number
        run: |
          echo "{\"v\":\"build-${GITHUB_RUN_NUMBER}\"}" > moi_full/build.json
          cat moi_full/build.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert moi_full/icons/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            rm -f $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Version code
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          cp moi-test.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Live update files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MOI.apk
          (cd moi_full && zip -qr ../out/bundle.zip .)
          cp moi_full/build.json out/version.json
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete live --cleanup-tag -y || true
          gh release create live out/MOI.apk out/bundle.zip out/version.json \
            --title "MOI live" --notes "build ${GITHUB_RUN_NUMBER}" --latest=false
