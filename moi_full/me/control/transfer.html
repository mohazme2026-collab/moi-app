<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MOI — Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ctl.css">
</head>
<body>
<div class="c-bg"></div>

<main class="c-page">

  <header class="c-top">
    <button class="c-back" id="cBack" type="button" aria-label="Back"><i data-ic="back"></i></button>
    <span class="c-title">Sell</span>
    <span class="c-top-sp"></span>
  </header>

  <div class="t-bal"><span>Balance</span><b id="tBal">0.00</b><i data-ic="ticket"></i></div>

  <section class="c-scroll">
    <div class="t-card">
      <div class="t-search"><input id="tId" type="text" inputmode="numeric" placeholder="Seller ID" autocomplete="off"><button class="t-btn" id="tSearch" type="button">Search</button></div>
      <p class="t-note">Sell your money to a seller and get cash. Contact the seller on WhatsApp first.</p>
      <p class="t-rec">Sellers</p>
      <div id="sellerList"></div>
    </div>
  </section>
</main>

<!-- Transfer পপআপ -->
<div class="t-mask" id="tMask">
  <div class="t-pop">
    <h2>Sell Money</h2>
    <div class="who"><img id="pAv" alt=""><b id="pName"></b><small id="pId"></small></div>
    <label for="pAmt">Amount to sell</label>
    <div class="t-amt"><input id="pAmt" type="text" inputmode="decimal" autocomplete="off"><i data-ic="ticket"></i></div>
    <div class="t-pbal">Balance: <span id="pBal">0.00</span><i data-ic="ticket"></i></div>
    <div class="t-pbtns"><button class="t-cancel" id="pCancel" type="button">Cancel</button><button class="t-confirm" id="pOk" type="button">Confirm</button></div>
  </div>
</div>

<div class="c-toast" id="cToast"></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core/firebase-init.js"></script>
<script src="../../shared/core/sync.js"></script>
<script src="../../shared/core/sync-routes.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/core/economy.js"></script>
<script src="../../shared/core/db-storage.js"></script>
<script src="../../shared/core/auth.js"></script>
<script src="icons.js"></script>
<script src="transfer.js"></script>
</body>
</html>
